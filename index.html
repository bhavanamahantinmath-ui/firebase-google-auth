<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth — Google Sign-In & Email</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Header -->
            <div class="auth-header">
                <div class="logo-badge">🔥</div>
                <h1 id="form-title">Welcome Back</h1>
                <p id="form-subtitle">Sign in to your account to continue</p>
            </div>

            <!-- Error Notification Banner -->
            <div id="error-banner" class="error-banner"></div>

            <!-- Google Sign-In Button -->
            <button id="btn-google-login" class="btn-google" type="button">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or with email</span>
            </div>

            <!-- Tab Switcher -->
            <div class="tabs">
                <button type="button" class="tab-btn active" id="tab-login">Sign In</button>
                <button type="button" class="tab-btn" id="tab-signup">Sign Up</button>
            </div>

            <!-- Authentication Form -->
            <form id="auth-form">
                <!-- Name Field (Only visible on Sign Up) -->
                <div class="form-group" id="group-name" style="display: none;">
                    <label for="name-input">Full Name</label>
                    <input type="text" id="name-input" placeholder="Alex Johnson">
                </div>

                <div class="form-group">
                    <label for="email-input">Email Address</label>
                    <input type="email" id="email-input" placeholder="alex@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password-input">Password</label>
                    <input type="password" id="password-input" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">
                    Sign In
                </button>
            </form>

        </div>
    </div>

    <!-- Auth Controller Logic -->
    <script type="module" src="auth.js"></script>
</body>
</html>
